# The full MOBO campaign on the worked example, after the pilot: the beam channel's aperture and the spiral
# inflector's rotation (geometry: every new value needs an electrode build and its 3D BEM fields, so that evaluation
# takes about 4 min: build ~20 s, fields ~2 min, then the tracking) together with the RF phase and the dee-voltage
# scale (cheap: they re-track on that geometry's fields, about 1.6-1.9 min each), 7 variables. After every new
# geometry the driver runs cheap_per_geometry cheap evaluations on it; every geometry gets its own model and fields
# under <campaign_dir>/geometries/<key>/. A radial slit is a later campaign of its own, on the design this one chooses
# (mobo_slit.toml). A first-harmonic magnetic trim is opt-in (its two variables are commented out below): the design
# has no trim coils.
#   pcr optimize        configs/examples/hchc1p5/mobo_campaign.toml --dry-run   (prints the first evaluation's command)
#   pcr optimize        configs/examples/hchc1p5/mobo_campaign.toml             (runs until max_evals; a rerun
#                                                                                continues; --max-hours H for a slot)
#   pcr optimize-status configs/examples/hchc1p5/mobo_campaign.toml
#   pcr optimize-verify configs/examples/hchc1p5/mobo_campaign.toml --pareto    (every particle, SC 128^3 every step)
# Every evaluation uses the GPU: run the campaign when nothing else does. Stopping the driver (Ctrl+C, closing its
# window, the end of --max-hours) stops the running evaluation with everything it started.
#
# Every electrode option the variables do not set comes from the base design's [geometry] section (the deck's build of
# wnop3_rotn3_g0ap: star ground, hug dees, dee 0's nose, the moved junctions, gap 0's counter post and round hole).
#
# What the pilot of 2026-11-02 changed here (E:\HCHC1.5\Results\CR\pcr_validation\mobo\pilot_analysis\pilot_report.md):
# * The trim, when opted in, is varied by its Cartesian components (trim_c, trim_s). The polar azimuth's seam at
#   +-180 deg and its dead value at zero amplitude put 10 of the pilot GP's 12 proposals on a bound of the box.
# * Every run tracks 7 turns (track.turns = 7 with track.stop_at_target_energy = false, in `fixed`). Designs below a
#   dee-voltage scale of about 0.97 needed an 8th turn to reach 3 MeV, and the end-of-run scores jump with the turn
#   count. A slow design now ends below 3 MeV, where the E_med constraint judges it: with E_med >= 2.9 one that ends
#   at 2.9-3.0 MeV stays feasible (pilot design 0015, volt 0.95 at -29 deg, ends its 7th turn near 2.93 MeV: a mean
#   of 2.92 in the pilot's run, a median of 2.94 in a 200-particle rerun without space charge); 3.0 would ask for the
#   design energy at the 7th turn.
# * The radial slit is a campaign of its own (mobo_slit.toml): with no slit (the warm start) its 3 other coordinates
#   did nothing, small openings lose the beam, and its pass is an unordered choice.
# * The inflector rotation spans +-3 deg (+-8 deg before, where by straight flight the bunch met gap 0's edge 6-9 mm
#   from the gap-0 hole's centre at the ends of the range; 0.6-4.7 mm now: see below).
# * n_startup = 20 evaluations before the GP takes over, enough for 9 variables, the opt-in trim's included
#   (>= 2 x 9 + 1; 16 for 13 variables before). They are the base and 4 random geometries with 3 cheap followers each
#   (the base and 3 before), so the 5 geometry coordinates start from 5 points.
# * The metal test is exact in z (track.obstacles = "columns", the default since 2026-11-02). The pilot's test, the
#   deck's slices, had a level every 1 mm and tested the nearest one: a channel face acted at the half millimetre next
#   to it, so the losses saw ap_inner and ap_outer in 2 mm steps of full height (everything in (26, 28) mm acted as
#   27 mm), a face on a level acted 0.5 mm off (pilot report, warning 3), and the levels z = +-15 mm had no ground.
#
# What this loop does not see:
# * The RF cavity frequency. The channel aperture changes the dee capacitance and so the resonant frequency of the
#   cavity; the BEM fields here are electrostatic at the fixed harmonic and frequency of [machine]. Check the final
#   design's frequency (and the voltage it then reaches) separately, with the RF cavity model.
# * The gap-0 hole does not follow the inflector. The base's hole (geometry.holes[0], s 46.12 mm along dee 0's gap-0
#   edge) was placed by geometry.build gap0_hole: 2 mm inward in radius of where the hand-off bunch, flown straight
#   from its plane, meets that edge at 4.726 deg. It stays where it is, while that crossing moves by about -0.9 mm per
#   degree of rotation: s 50.84 / 48.31 / 45.54 mm at 1.726 / 4.726 / 7.726 deg
#   (pcr_validation\fixes_2026-11-02\si_rot_hole). At the ends of the si_rot range the R 10 mm hole is 2.5-2.8 mm off
#   the place gap0_hole gives it, and the straight-flight crossing is 4.7 / 0.6 mm from the hole's centre at
#   1.726 / 7.726 deg (2.2 mm at the base, where the tracked bunch of the first pilot's warm start meets the edge
#   1.1 mm from it): the rotation's scores include that misalignment, the larger one at the low end.
#   Re-centre the hole of a chosen rotation (`python -m PyCentralRegion.geometry.build hole ...`) before reading a
#   rotation trend as physics.

[mobo]
campaign_dir = "E:/HCHC1.5/Results/CR/mobo/campaign_wnop3_rotn3_g0ap"
base_config_file = "design_wnop3_rotn3_g0ap.toml"
physics_python = "C:/Users/Daniel/anaconda3/envs/accel-dev-env/python.exe"
sampler = "gp"                 # constrained 3-objective GP (logCEHVI) over 7 coordinates (9 with the opt-in trim);
                               # "tpe" uses the same store
seed = 0
n_startup = 20                 # the warm start and 19 random designs (5 geometries with their cheap followers):
                               # at least 2 x 9 + 1 (the opt-in trim included) before the GP takes over
max_evals = 120                # ~30 geometries x (1 + cheap_per_geometry): 30 x 4 min + 90 x 1.6-1.9 min,
                               # about 4.5-5 h
cheap_per_geometry = 3
failed_as_infeasible = false   # a failed build, BEM or tracking blocks only its own design (a design that loses its
                               # beam is learnt either way: the scorer skips it, and it enters with the worst values)
fixed = [
    'geometry.si_rotation="fixed"',      # the builder turns the housing by [inflector] rotation_deg (a variable here;
                                         # the base's "corner" rule gives 4.726 deg, the same build at that angle)
    "btrim.r_min_m=0.05", "btrim.r_max_m=0.135",   # radial extent of the opt-in trim (inert without it)
    "track.turns=7", "track.stop_at_target_energy=false",   # every design scored at its 7th turn
]
# The base design first: its channel (26 mm inside r = 100 mm, 32 mm beyond r = 140 mm: centre 120, length 40, as its
# [geometry] sets it and its model cr_model_wnop3_rotn3_g0ap_model3d.pkl has it), every other variable at the base
# config's value (the rotation 4.726 deg, phase -15 deg, dee voltage x 1, no trim).
warm_start = [{ap_inner = 26.0, ap_outer = 32.0, ap_center = 120.0, ap_length = 40.0}]

# --- geometry: the beam channel (full heights of the dees' opening; the dummy dees share them) ---------------------
# Bounds (checked at build time; `python -m PyCentralRegion.geometry.build bounds design_wnop3_rotn3_g0ap.toml` prints
# them): every height <= 2 x (plate_half_gap_mm - dee_wall_mm) = 2 x (25 - 5) = 40 mm (the base's +-25 mm pole-nose
# faces and 5 mm dee plates: the +-20 mm upper limit of the opening agreed with IBA); the inner height >= 2 x the
# housing exit's half height = 2 x 10.74 mm = 21.5 mm (the exit circle's largest |z| in the sp1Lo_c1 housing
# outline); the heights at the exit's outermost radius (84.87 mm) are held to the same bound, which never binds in
# this box (every height >= 22 mm). The taper runs linearly over centre -+ length / 2; centre >= length / 2 + 10 mm at
# every corner of the box keeps the taper's inner end at r >= 10 mm (it must be > 0). Where ap_inner = ap_outer the
# channel is flat and ap_center / ap_length change no electrode: those designs share one geometry key, one build.
# The channel inside r = 145 mm matters most at early phases. In the first pilot (all on the base channel: +-13 mm
# inside r = 100 mm, opening to +-16 mm at 140 mm) the share of the bunch lost on metal at |z| > 12 mm inside
# r = 145 mm (most of it on the channel's faces in r 100-145 mm, nearly all in the particles' first two turns) grows
# from about 10 % at -3..-5 deg and 19 % at -15 deg to 32-41 % at -29..-39 deg; beyond r = 145 mm the loss is 10-14 %
# at every phase. Of the survivors, under 1 % pass +-11 mm inside r = 100 mm at any phase, about 4-9 % in r 100-140 mm
# at -25..-36 deg with a dee-voltage scale below 1.02 (at most 3 % otherwise), and about 11-12 % pass +-13 mm in
# r 140-300 mm at every phase: ap_outer = 26 would cut about that at any phase, the fields aside
# (pcr_validation\fixes_2026-11-02\check_cliff_beam.txt). The reference particle is no guide here: at -39 deg it
# swings between -16 and +15 mm beyond r = 140 mm, while the survivors' mean z stays within 1 mm of the median plane.
[[mobo.variables]]
name = "ap_inner"
target = "geometry.aperture_inner_mm"    # inside the taper [mm]
low = 22.0
high = 40.0
kind = "geometry"

[[mobo.variables]]
name = "ap_outer"
target = "geometry.aperture_outer_mm"    # beyond it [mm] (smaller than ap_inner is allowed: an inverted taper)
low = 26.0
high = 40.0
kind = "geometry"

[[mobo.variables]]
name = "ap_center"
target = "geometry.aperture_taper_center_mm"   # [mm]
low = 90.0
high = 220.0
kind = "geometry"

[[mobo.variables]]
name = "ap_length"
target = "geometry.aperture_taper_length_mm"   # [mm]
low = 10.0
high = 160.0
kind = "geometry"

# --- geometry: the spiral inflector's rotation about the machine axis (housing, exit and hand-off bunch turn with it,
# gap 0's variable segment follows the exit plate: geometry.gap0_on_plate; the tracker checks that the model was built
# with the same angle; the gap-0 hole does not follow: see the header) ---------------------------------------------
[[mobo.variables]]
name = "si_rot"
target = "inflector.rotation_deg"        # +-3 deg about the base design's 4.726 deg (exit-plate corner on gap 0's ray)
low = 1.726
high = 7.726
kind = "geometry"

# --- cheap: RF phase, dee voltage ----------------------------------------------------------------------------------
[[mobo.variables]]
name = "phase"
target = "track.phases_deg"              # one RF phase per evaluation [deg]
low = -40.0
high = 0.0
as_list = true

[[mobo.variables]]
name = "volt"
target = "track.volt_scale"              # dee voltage / the 65 kV the BEM fields are normalised to
low = 0.95
high = 1.10

# --- opt-in, not part of the design: a first-harmonic magnetic trim (cheap) ---------------------------------------
# The design has no trim coils, so the trim stays off. To study one as a what-if, uncomment the two variables below,
# run them in another campaign_dir (a started campaign keeps its variables), and label every result that uses them
# "with trim". On the first pilot's best design (its eval 0014) the trim was worth about +0.06 mA: 4.591 mA with its
# 0.83 mT, 4.533 mA without, at the search fidelity with the column test
# (E:\HCHC1.5\Results\CR\pcr_validation\mobo\pilot_analysis\retrack_0014).
# The trim b(r) [b_c cos(theta) + b_s sin(theta)] by its Cartesian components: zero trim is one point, the centre of
# the square, and there is no seam. The +-2 mT box is a what-if range, not a coil's limit (its corners reach 2.83 mT).
# [[mobo.variables]]
# name = "trim_c"
# target = "btrim.amplitude_cos_t"         # first-harmonic trim, cos(theta) component b_c [T]
# low = -2e-3
# high = 2e-3
#
# [[mobo.variables]]
# name = "trim_s"
# target = "btrim.amplitude_sin_t"         # its sin(theta) component b_s [T]
# low = -2e-3
# high = 2e-3

# --- objectives and constraints ------------------------------------------------------------------------------------
[[mobo.objectives]]
metric = "I_final"                       # T x injected current [mA]
direction = "maximize"

[[mobo.objectives]]
metric = "valley_all"                    # share of probe crossings between the turns, the 8 probes' crossings
                                         # pooled
direction = "minimize"

[[mobo.objectives]]
metric = "ratio"                         # aspect ratio of the bunch core at the last turn
direction = "minimize"

[[mobo.constraints]]
metric = "E_med"                         # median final energy [MeV], at the 7th turn
op = ">="
value = 2.9

# Clean turns need the energy spread too: turn_sigR <= 3 mm (8 sigma at a 24 mm turn separation) needs
# dE_E_robust <= ~1.3 % at R = 330 mm (PyCentralRegion.analysis.objectives.METRICS: turn_sigR, dE_E_robust, sigR_E,
# fan_proj_last). The designs so far sit near 1.9 %, so with it enabled from the start no evaluation is feasible and
# the sampler has nothing to steer by. Enable it here once the Pareto set comes near it: the store keeps every
# evaluation's scores, so the earlier ones are judged by it as well.
# [[mobo.constraints]]
# metric = "dE_E_robust"
# op = "<="
# value = 0.013

# --- fidelities ----------------------------------------------------------------------------------------------------
# They differ in resolution only. Both track exactly 7 turns (`fixed` above), so every design is scored at the same
# turn in both, and the search-to-verify shift of a score is its resolution error.
[mobo.fidelities.search]       # what the sampler learns from: 10k particles (all of them tracked for the 8 probes'
                               # valley share), SC 64^3 every 5 steps
overrides = ["track.n_final=10000", "track.sc_final_cells=64", "track.sc_final_every=5", "track.n_tracks=10000"]
timeout_min = 60.0             # a new geometry: build + 3D BEM + tracking

[mobo.fidelities.verify]       # pcr optimize-verify: every particle, SC 128^3 every step
overrides = ["track.n_final=0", "track.sc_final_cells=128", "track.sc_final_every=1"]
timeout_min = 240.0
