# Design wnop3_rotn3_g0ap of the worked example (built and tracked 2026-10-31 as the "test drive"): the wnop3 gap
# geometry with the free dee opening 32.55 deg, the spiral inflector turned +4.726 deg so its exit-plate corner sits on
# gap 0's ray, dee 0's nose rounded (R 3 mm), junctions of gaps 2 / 3 moved to 124.6 / 208.5 mm, no posts, only gap 0's
# counter post with the R 10 mm round hole. Its 3D tracking at -15 deg (every particle, SC 128^3 every step) gave
# T = 50.1 % = 4.02 mA at 3.094 +- 0.070 MeV.
#   pcr build  configs/examples/hchc1p5/design_wnop3_rotn3_g0ap.toml     (electrodes -> paths.model3d)
#   pcr fields configs/examples/hchc1p5/design_wnop3_rotn3_g0ap.toml     (3D BEM -> paths.fields)
#   pcr track  configs/examples/hchc1p5/design_wnop3_rotn3_g0ap.toml     (bunch tracking -> run.out_dir)
# Stages reuse an output file that already exists; point a path elsewhere to rebuild.

include = ["machine.toml"]

[run]
name = "wnop3_rotn3_g0ap"
out_dir = "E:/HCHC1.5/Results/CR/pcr/wnop3_rotn3_g0ap"

[paths]
seed = "E:/HCHC1.5/Results/CR/optimized_cavity_geometry_wnop3_bo_cold05c2s.pkl"
model3d = "E:/HCHC1.5/Results/CR/cr_model_wnop3_rotn3_g0ap_model3d.pkl"
fields = "E:/HCHC1.5/Results/CR/bunch_fields3d_wnop3_rotn3_g0ap.pkl"

[machine]
dee_opening_deg = 32.547930952023954   # the seed optimization's free opening

[inflector]
rotation_deg = 4.726034523988023       # the electrode builder's "corner" rotation for this seed (gap-0 ray 28.726 deg)

[track]
phases_deg = [-15.0]                   # the phase the 4k scan picked
probes_deg = [25.0, 45.0, 160.0]

# The electrodes as the design deck built them (cr_geom_build.py with CR_SI_ROT=corner, CR_GROUND=star,
# CR_DEE_INNER=hug, CR_DEE0_NOSE_MM=3, CR_JUNCTION_R=2:124.6,3:208.5, CR_APERTURE_MM=26,32, CR_APERTURE_R_MM=100,140,
# --dee0-clearance 5 --lc 8 --lc-outer 16 --gap-apertures for the gap-0 hole). The emitting plane is the export's own
# hand-off beside the housing outline (geometry.emitting_plane_file empty), the exit plane spec the export's
# exit_plane_spec.json.
[geometry]
si_rotation = "corner"                 # gap-0 ray 28.726 deg - the export's 24.0 = inflector.rotation_deg above
gap0_on_plate = true
ground = "star"
dee_inner = "hug"
aperture_inner_mm = 26.0               # 26 mm inside r = 100 mm, 32 mm beyond r = 140 mm
aperture_outer_mm = 32.0
aperture_taper_center_mm = 120.0
aperture_taper_length_mm = 40.0
plate_half_gap_mm = 25.0               # the +-25 mm nose faces: channel heights up to 2 x (25 - 5) = 40 mm
dee0_clearance_mm = 5.0
dee0_nose_mm = 3.0
lc_outer_mm = 16.0                     # graded mesh: 8 mm inside r = 150 mm, 16 mm beyond 220 mm

[[geometry.junctions]]
gap = 2
r_mm = 124.6

[[geometry.junctions]]
gap = 3
r_mm = 208.5

[[geometry.holes]]                     # gap 0's counter post: an R 10 mm hole 2 mm radially inward of where the R10
gap = 0                                # hand-off bunch meets dee0's gap-0 edge (geometry.build.gap0_hole with
side = "dee"                           # dr_mm = -2, rim_mm = 8; the bunch itself crosses at s 48.31 mm)
r_mm = 10.0
s_mm = 46.12
z_mm = 0.0
s_lo_mm = 28.12
s_hi_mm = 64.12
