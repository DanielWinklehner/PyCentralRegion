# MOBO pilot on the worked example: about 20 evaluations over cheap variables only (RF phase and dee-voltage scale; a
# first-harmonic magnetic trim is opt-in, below: the design has no trim coils), all on the existing electrode model
# and BEM fields of design_wnop3_rotn3_g0ap (its paths.model3d / paths.fields), so every evaluation is a 3D bunch
# tracking with space charge plus scoring, about 1.6-1.9 min (the first pilot's 20 evaluations took 33 min with the
# deck's slice test; the one search evaluation timed with the column test, the default, took 114 s).
#   pcr optimize        configs/examples/hchc1p5/mobo_pilot.toml --dry-run   (prints the first evaluation's command)
#   pcr optimize        configs/examples/hchc1p5/mobo_pilot.toml             (runs until max_evals; rerun continues)
#   pcr optimize-status configs/examples/hchc1p5/mobo_pilot.toml
#   pcr optimize-verify configs/examples/hchc1p5/mobo_pilot.toml --pareto    (every particle, SC 128^3 every step)
# The driver runs in its own small environment (numpy, scipy, optuna >= 5, torch CPU, greenlet); the evaluations run in
# the physics environment below, with the source folder of the driver's own PyCentralRegion first on their PYTHONPATH
# (they run the code the driver runs). Every evaluation uses the GPU. Stopping the driver (Ctrl+C, closing its window,
# the end of --max-hours) stops the running evaluation with everything it started; running it again continues the
# campaign.
#
# The first pilot (2026-11-02; E:\HCHC1.5\Results\CR\pcr_validation\mobo\pilot_wnop3_rotn3_g0ap, its report in
# ..\pilot_analysis\pilot_report.md) varied the trim by amplitude and azimuth and tracked every design until its
# reference reached 3 MeV. This file is its successor, another search space and so another campaign_dir:
# * the trim by its Cartesian components (trim_c, trim_s): the azimuth's seam at +-180 deg and its dead value at zero
#   amplitude put 10 of the first pilot's 12 GP proposals on a bound;
# * every run tracks 7 turns (in `fixed`): two designs below a dee-voltage scale of about 0.97 needed an 8th turn to
#   reach 3 MeV, and the end-of-run scores jump with the turn count. A slow design now ends below 3 MeV, where the
#   E_med constraint judges it: with E_med >= 2.9 one that ends at 2.9-3.0 MeV stays feasible (design 0015, volt
#   0.95 at -29 deg, ends its 7th turn near 2.93 MeV: a mean of 2.92 in the first pilot's run, a median of 2.94 in a
#   200-particle rerun without space charge); 3.0 would ask for the design energy at the 7th turn.
# The second pilot (2026-11-03, the campaign_dir below) ran with the trim opted in: its store holds trim_c and trim_s,
# so the driver reads or continues it only with the two variables uncommented (a campaign keeps its search space). A
# pilot without the trim is another search space: give it another campaign_dir.
# The warm start reaches 3 MeV in 7 turns: under the old and the new rule it is the same run array for array at 200
# particles without space charge (pcr_validation\fixes_2026-11-02\track). At the search fidelity it gives 4.080 mA
# (T = 50.79 %) with the column test, the default since 2026-11-02; the first pilot gave it 4.049 mA (50.40 %) with
# the deck's slice test, which puts the channel's faces up to half a millimetre off, but for slivers thinner than a
# level and the ground's faces near z = +-15 mm (on the channel's taper up to 1.5 mm, into the metal: the deck's
# slices lack the ground at z = +-15 mm; pcr_validation\metal_columns_2026-11-02). 'track.obstacles="raster"' in
# `fixed` repeats the first pilot's run.

[mobo]
campaign_dir = "E:/HCHC1.5/Results/CR/mobo/pilot2_wnop3_rotn3_g0ap"
base_config_file = "design_wnop3_rotn3_g0ap.toml"
physics_python = "C:/Users/Daniel/anaconda3/envs/accel-dev-env/python.exe"
sampler = "gp"                 # constrained 3-objective GP (logCEHVI); "tpe" works on the same store
seed = 0
n_startup = 9                  # the warm start plus 8 random designs (>= 2 x 4 + 1), then 11 model-guided ones
max_evals = 20
fixed = [
    "btrim.r_min_m=0.05", "btrim.r_max_m=0.135",           # radial extent of the opt-in trim (inert without it)
    "track.turns=7", "track.stop_at_target_energy=false",  # every design scored at its 7th turn
]
warm_start = [{phase = -15.0, volt = 1.0}]   # the design as tracked on 2026-10-31 (an opted-in trim takes the base
                                             # config's zero)

[[mobo.variables]]
name = "phase"
target = "track.phases_deg"    # one RF phase per evaluation
low = -40.0
high = 0.0
as_list = true

[[mobo.variables]]
name = "volt"
target = "track.volt_scale"    # dee voltage / the 65 kV the BEM fields are normalised to
low = 0.95
high = 1.10

# Opt-in, not part of the design: a first-harmonic magnetic trim. The design has no trim coils, so the trim stays off.
# Uncomment the two variables to study one as a what-if (in another campaign_dir) or to read the second pilot's
# store, and label every result that uses them "with trim" (mobo_campaign.toml says what it was worth). The trim b(r)
# [b_c cos(theta) + b_s sin(theta)] by its Cartesian components: zero trim is one point, the centre of the square, and
# there is no seam. The +-2 mT box is a what-if range, not a coil's limit (its corners reach 2.83 mT).
# [[mobo.variables]]
# name = "trim_c"
# target = "btrim.amplitude_cos_t"   # first-harmonic trim, cos(theta) component b_c [T]
# low = -2e-3
# high = 2e-3
#
# [[mobo.variables]]
# name = "trim_s"
# target = "btrim.amplitude_sin_t"   # its sin(theta) component b_s [T]
# low = -2e-3
# high = 2e-3

[[mobo.objectives]]
metric = "I_final"             # T x injected current [mA]
direction = "maximize"

[[mobo.objectives]]
metric = "valley_all"          # share of probe crossings between the turns, the 8 probes' crossings pooled
direction = "minimize"

[[mobo.objectives]]
metric = "ratio"               # aspect ratio of the bunch core at the last turn
direction = "minimize"

[[mobo.constraints]]
metric = "E_med"               # median final energy [MeV], at the 7th turn
op = ">="
value = 2.9

# The fidelities differ in resolution only. Both track exactly 7 turns (`fixed` above), so every design is scored at
# the same turn in both, and the search-to-verify shift of a score is its resolution error.
[mobo.fidelities.search]       # what the sampler learns from: 10k particles, SC 64^3 every 5 steps
overrides = ["track.n_final=10000", "track.sc_final_cells=64", "track.sc_final_every=5", "track.n_tracks=10000"]
timeout_min = 30.0

[mobo.fidelities.verify]       # pcr optimize-verify: every particle, SC 128^3 every step
overrides = ["track.n_final=0", "track.sc_final_cells=128", "track.sc_final_every=1"]
timeout_min = 240.0
