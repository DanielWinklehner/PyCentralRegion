# MOBO pilot on the worked example: about 20 evaluations over cheap variables only (RF phase, dee-voltage scale and a
# first-harmonic magnetic trim), all on the existing electrode model and BEM fields of design_wnop3_rotn3_g0ap (its
# paths.model3d / paths.fields), so every evaluation is a 3D bunch tracking with space charge plus scoring, about
# 1.6 min (the 20 evaluations took 33 min).
#   pcr optimize        configs/examples/hchc1p5/mobo_pilot.toml --dry-run   (prints the first evaluation's command)
#   pcr optimize        configs/examples/hchc1p5/mobo_pilot.toml             (runs until max_evals; rerun continues)
#   pcr optimize-status configs/examples/hchc1p5/mobo_pilot.toml
#   pcr optimize-verify configs/examples/hchc1p5/mobo_pilot.toml --pareto    (every particle, SC 128^3 every step)
# The driver runs in its own small environment (numpy, scipy, optuna >= 5, torch CPU); the evaluations run in the
# physics environment below, with the source folder of the driver's own PyCentralRegion first on their PYTHONPATH
# (they run the code the driver runs). Every evaluation uses the GPU. Stopping the driver (Ctrl+C, closing its window,
# the end of --max-hours) stops the running evaluation with everything it started; running it again continues the
# campaign.

[mobo]
campaign_dir = "E:/HCHC1.5/Results/CR/mobo/pilot_wnop3_rotn3_g0ap"
base_config_file = "design_wnop3_rotn3_g0ap.toml"
physics_python = "C:/Users/Daniel/anaconda3/envs/accel-dev-env/python.exe"
sampler = "gp"                 # constrained 3-objective GP (logCEHVI); "tpe" works on the same store
seed = 0
n_startup = 8                  # the warm start plus 7 random designs, then 12 model-guided ones
max_evals = 20
fixed = ["btrim.r_min_m=0.05", "btrim.r_max_m=0.135"]    # radial extent of the trim (its shape is not optimised here)
warm_start = [{phase = -15.0, volt = 1.0, trim_amp = 0.0, trim_phase = 0.0}]   # the design as tracked on 2026-10-31

[[mobo.variables]]
name = "phase"
target = "track.phases_deg"    # one RF phase per evaluation
low = -40.0
high = 0.0
as_list = true

[[mobo.variables]]
name = "volt"
target = "track.volt_scale"    # dee voltage / the 65 kV the BEM fields are normalised to
low = 0.95
high = 1.10

[[mobo.variables]]
name = "trim_amp"
target = "btrim.amplitude_t"   # first-harmonic trim amplitude [T]
low = 0.0
high = 2e-3

[[mobo.variables]]
name = "trim_phase"
target = "btrim.phase_deg"     # its azimuth [deg]
low = -180.0
high = 180.0

[[mobo.objectives]]
metric = "I_final"             # T x injected current [mA]
direction = "maximize"

[[mobo.objectives]]
metric = "valley_all"          # share of probe crossings between the turns, the 8 probes' crossings pooled
direction = "minimize"

[[mobo.objectives]]
metric = "ratio"               # aspect ratio of the bunch core at the last turn
direction = "minimize"

[[mobo.constraints]]
metric = "E_med"               # median final energy [MeV]
op = ">="
value = 2.9

# The fidelities differ in resolution only. Both track to the base's turn cap (track.turns = 8; a run ends earlier,
# when the reference reaches machine.target_energy_mev = 3 MeV: within 7 turns for the base design), so a design too
# slow to get there is cut at the same turn in both, and the search-to-verify shift of a score is its resolution error.
[mobo.fidelities.search]       # what the sampler learns from: 10k particles, SC 64^3 every 5 steps
overrides = ["track.n_final=10000", "track.sc_final_cells=64", "track.sc_final_every=5", "track.n_tracks=10000"]
timeout_min = 30.0

[mobo.fidelities.verify]       # pcr optimize-verify: every particle, SC 128^3 every step
overrides = ["track.n_final=0", "track.sc_final_cells=128", "track.sc_final_every=1"]
timeout_min = 240.0
