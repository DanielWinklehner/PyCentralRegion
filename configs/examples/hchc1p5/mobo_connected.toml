# The MOBO campaign of the connected gap lines (2026-11-03): the dee opening, every gap line's shape and the beam
# channel (geometry: a new value needs a build and its 3D BEM, about 4-5 min) with the RF phase (cheap: a re-track
# on that geometry's fields, about 1.6-1.9 min), 37 variables.
#
# The gap lines (geometry.gap_lines = "connected", design_connected_cold.toml): each gap runs P0 -> P1 -> P2 -> its
# radial ray without steps (RF engineering cannot build the seed's jogs). Every gap has 4 variables: P1's and P2's
# places along the ray (r1 between the seed orbit's turn-1 and turn-2 crossings of that gap, r2 between turns 2 and 3,
# 15 % of each band kept clear of the crossings) and P0's and P1's offsets across it (f0, f1) as fractions in [-1, 1]
# of what the limits allow - P0 and P1 at most 8 deg off the ray, bends at P1 and P2 at most 35 deg - so every point of
# the box is a buildable line and the cold start (every fraction 0) puts the gap on its ray. Gap 0 runs along the exit
# plate up to where that line meets its ray (r 98.2 mm), its bend there free, so it has no f0: 3 variables.
#
# The dee opening is a variable and the spiral inflector turns with it (si_rotation = "corner": gap 0's ray - 24.0 deg,
# so 21 - opening / 2 = +7.0 .. +2.0 deg over 28 .. 38 deg; the tracker follows the model), and the gap-0 hole is
# placed at every build where the hand-off bunch meets dee0's gap-0 edge. The dees run at 65 kV (the RF group's limit:
# track.volt_scale = 1, no voltage variable). No magnetic trim: the design has no trim coils.
#
# The warm starts are the cold start (radial gap lines) at the seed's opening 32.548 deg and at 28 and 38 deg, each
# with 3 cheap followers (other phases): the first preliminary results. Then random designs until n_startup, then the
# GP. Every evaluation uses the GPU: run the campaign when nothing else does.
#   pcr optimize        configs/examples/hchc1p5/mobo_connected.toml --dry-run
#   pcr optimize        configs/examples/hchc1p5/mobo_connected.toml --max-hours 12
#   pcr optimize-status configs/examples/hchc1p5/mobo_connected.toml
#
# What this loop does not see: the RF cavity frequency (the gap lines and the channel change the dee capacitance; the
# BEM fields are electrostatic at [machine]'s harmonic and frequency) - check a chosen design with the RF model.

[mobo]
# campaign_connected (100 evaluations, 2026-11-03) was built before the checked cuts: its channel tapers ending beyond
# ~150 mm left dees and the ground whole, so those designs read as bad for a false reason. Do not resume it.
campaign_dir = "F:/HCHC1.5/Results/CR/mobo/campaign_connected2"
base_config_file = "design_connected_cold.toml"
physics_python = "C:/Users/Daniel/anaconda3/envs/accel-dev-env/python.exe"
sampler = "gp"                 # constrained 3-objective GP (logCEHVI) over 37 coordinates
seed = 0
n_startup = 79                 # 2 x (37 + 2) + 1: the 3 warm starts and random designs (20 geometries with their
                               # cheap followers) before the GP takes over
max_evals = 400                # about 100 geometries x (1 + cheap_per_geometry); a night is about 300
cheap_per_geometry = 3
failed_as_infeasible = false   # a failed build, BEM or tracking blocks only its own design
fixed = [
    "track.volt_scale=1.0",                                   # 65 kV
    "track.turns=7", "track.stop_at_target_energy=false",    # every design scored at its 7th turn
]
warm_start = [{}, { phi = 28.0 }, { phi = 38.0 }]

# --- geometry: the dee opening (the spiral inflector turns with it) -------------------------------------------------
[[mobo.variables]]
name = "phi"
target = "machine.dee_opening_deg"
low = 28.0
high = 38.0
kind = "geometry"

# --- geometry: the beam channel (as in mobo_campaign.toml; its header has the bounds) ------------------------------
[[mobo.variables]]
name = "ap_inner"
target = "geometry.aperture_inner_mm"    # inside the taper [mm]
low = 22.0
high = 40.0
kind = "geometry"

[[mobo.variables]]
name = "ap_outer"
target = "geometry.aperture_outer_mm"    # beyond it [mm]
low = 26.0
high = 40.0
kind = "geometry"

[[mobo.variables]]
