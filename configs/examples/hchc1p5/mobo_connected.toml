# --- cheap: the RF phase ---------------------------------------------------------------------------------------------
[[mobo.variables]]
name = "phase"
target = "track.phases_deg"              # one RF phase per evaluation [deg]
low = -40.0
high = 0.0
as_list = true

# --- objectives and constraints (as in mobo_campaign.toml) -----------------------------------------------------------
[[mobo.objectives]]
metric = "I_final"                       # T x injected current [mA]
direction = "maximize"

[[mobo.objectives]]
metric = "valley_all"                    # share of probe crossings between the turns, the 8 probes' pooled
direction = "minimize"

[[mobo.objectives]]
metric = "ratio"                         # aspect ratio of the bunch core at the last turn
direction = "minimize"

[[mobo.constraints]]
metric = "E_med"                         # median final energy [MeV], at the 7th turn
op = ">="
value = 2.9

# --- fidelities (as in mobo_campaign.toml) ---------------------------------------------------------------------------
[mobo.fidelities.search]       # 10k particles (all tracked for the 8 probes' valley share), SC 64^3 every 5 steps
overrides = ["track.n_final=10000", "track.sc_final_cells=64", "track.sc_final_every=5", "track.n_tracks=10000"]
timeout_min = 60.0

[mobo.fidelities.verify]       # pcr optimize-verify: every particle, SC 128^3 every step
overrides = ["track.n_final=0", "track.sc_final_cells=128", "track.sc_final_every=1"]
timeout_min = 240.0
