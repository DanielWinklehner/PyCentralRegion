# The full cold-started central-region optimization with the v6 field map (2026-11-06, SmootherRMax) and the spiral
# inflector v6o_c1 (optimized and levelled for a 38 deg dee opening), 2026-11-07: the dee opening, every gap line's
# shape and the beam channel (geometry: 36 variables) with the RF phase and the magnet level (cheap: 2 variables).
#
# Posts in the loop ([post_rule] in design_v6o_c1_cold.toml): every new geometry is built and tracked bare (a scan
# over -45 .. +15 deg in 15 deg steps at level 1.000), the rule places posts between the survivors' turn bands on gaps
# 1-5 and inside the first band on gap 1, and the geometry with its posts is re-built, re-solved and tracked: that run
# is scored. A model with posts that fails to build or solve falls back to the bare one (recorded in the scores'
# post_rule.fallback). The cheap followers re-track the model with its posts.
#
# Measured on the cold start (38 deg, 2026-11-07): a new geometry about 15 min (bare build 24 s, bare BEM about 3 min,
# the bare scan and final about 4.8 min, the rule 26 s, the build with posts 45 s, its BEM 4.6 min, the final track
# 39 s); a cheap follower about 1.6-1.9 min. With 3 followers about 20 min per geometry: 48 h is about 140 geometries.
# Disk per geometry about 0.2 GB (model and field map) plus 0.4 GB per evaluation (its track_data.pkl).
#
# The gap lines (geometry.gap_lines = "connected"): P0 -> P1 -> P2 -> the gap's radial ray. P1 lies r1 along the ray
# and P2 dr beyond it (r2 = r1 + dr), so P1 can sit anywhere from just inside the beam's first crossing of the gap to
# about its third (the bands of the cold start at 38 deg, 2026-11-07), and the two bends move together over the turns;
# f0 and f1 are P0's and P1's offsets across the ray as fractions of what the limits allow (P0 and P1 at most 8 deg
# off the ray, bends at most 35 deg), so every point of the box is a buildable line and the cold start (every fraction
# 0) puts the gap on its ray. Gap 0 runs along the exit plate up to where that line meets its ray (r 97.6 mm, the same
# at every opening under the corner rule), its bend there free: no f0, and r1 starts at 103 mm.
#
# The dee opening is a variable and the spiral inflector turns with it (si_rotation = "corner": 19 - opening / 2 =
# +2.0 .. -3.5 deg over 34 .. 45 deg; the inflector's E-field, housing and hand-off bunch are v6o_c1's, turned rigidly).
# The dees run at 65 kV (the RF group's limit: track.volt_scale = 1). No magnetic trim: the design has no trim coils.
# The magnet level is a cheap variable (+-0.5 %, the RF frequency fixed at f_rev 8.191375 MHz); the rule places the
# posts at level 1.000.
#
# Objectives, read at 0 deg in pass 7 (the virtual probe): the current within +-2 % of the best energy window, the
# total current, and the vertical size of the beam (95th percentile of |z|); E_med >= 2.9 MeV. The Pareto set is the
# result: 5 mA in total is the requirement, not a constraint.
#
# The warm starts: the cold start at 38 deg and at 34, 42 and 45 deg, and at 36 and 40 deg with the channel of the
# best earlier design (ai_g3dee), each with 3 cheap followers. Then random designs until n_startup, then the GP.
# Every evaluation uses the GPU: run the campaign when nothing else does.
#   pcr optimize        configs/examples/hchc1p5/mobo_v6o_c1.toml --dry-run
#   pcr optimize        configs/examples/hchc1p5/mobo_v6o_c1.toml --max-hours 48
#   pcr optimize-status configs/examples/hchc1p5/mobo_v6o_c1.toml
#   pcr optimize-verify configs/examples/hchc1p5/mobo_v6o_c1.toml --top 5
#
# What this loop does not see: the RF cavity frequency (the gap lines, the channel and the posts change the dee
# capacitance; the BEM fields are electrostatic at [machine]'s harmonic and frequency) - check a chosen design with the
# RF model.

[mobo]
campaign_dir = "F:/HCHC1.5/Results/CR/mobo/campaign_v6o_c1"
base_config_file = "design_v6o_c1_cold.toml"
physics_python = "C:/Users/Daniel/anaconda3/envs/accel-dev-env/python.exe"
sampler = "gp"                 # constrained 3-objective GP (logCEHVI) over 38 coordinates
seed = 0
n_startup = 81                 # 2 x (38 + 2) + 1: the 6 warm starts and random designs (about 20 geometries with
                               # their cheap followers) before the GP takes over
max_evals = 800                # about 200 geometries x (1 + cheap_per_geometry); 48 h is about 560
cheap_per_geometry = 3
failed_as_infeasible = false   # a failed build, BEM or tracking blocks only its own design
fixed = [
    "track.volt_scale=1.0",                                   # 65 kV
    "track.turns=7", "track.stop_at_target_energy=false",    # every design scored at its 7th turn
]
warm_start = [
    {},
    { phi = 34.0 },
    { phi = 42.0 },
    { phi = 45.0 },
    { phi = 36.0, ap_inner = 34.804, ap_outer = 28.874, ap_center = 189.60, ap_length = 129.47 },
    { phi = 40.0, ap_inner = 34.804, ap_outer = 28.874, ap_center = 189.60, ap_length = 129.47 },
]

# --- geometry: the dee opening (the spiral inflector turns with it) -------------------------------------------------
[[mobo.variables]]
name = "phi"
target = "machine.dee_opening_deg"
low = 34.0
high = 45.0
kind = "geometry"

# --- geometry: the beam channel [mm] (full heights: up to 2 x (plate_half_gap 24.5 - 5); at least the inflector's
#     exit with its margin, 21.3) -------------------------------------------------------------------------------------
[[mobo.variables]]
name = "ap_inner"
target = "geometry.aperture_inner_mm"    # inside the taper
low = 22.0
high = 39.0
kind = "geometry"

[[mobo.variables]]
name = "ap_outer"
target = "geometry.aperture_outer_mm"    # beyond it
low = 22.0
high = 39.0
kind = "geometry"

[[mobo.variables]]
name = "ap_center"
target = "geometry.aperture_taper_center_mm"
low = 90.0
high = 220.0
kind = "geometry"

[[mobo.variables]]
name = "ap_length"
target = "geometry.aperture_taper_length_mm"
low = 10.0
high = 160.0
kind = "geometry"

