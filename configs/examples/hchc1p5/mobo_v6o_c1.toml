# --- cheap: the RF phase and the magnet level ------------------------------------------------------------------------
[[mobo.variables]]
name = "phase"
target = "track.phases_deg"              # one RF phase per evaluation [deg]
low = -45.0
high = 15.0
as_list = true

[[mobo.variables]]
name = "level"
target = "magnet.scale"                  # the field map's level, f_rev fixed
low = 0.995
high = 1.005

# --- objectives and constraint: read at 0 deg in pass 7 --------------------------------------------------------------
[[mobo.objectives]]
metric = "I_2pct_best_az"                # current within +-2 % of the best energy window [mA]
direction = "maximize"

[[mobo.objectives]]
metric = "I_final_az"                    # total current [mA]
direction = "maximize"

[[mobo.objectives]]
metric = "z_p95_az"                      # 95th percentile of |z| [mm]
direction = "minimize"

[[mobo.constraints]]
metric = "E_med_az"                      # median energy [MeV]
op = ">="
value = 2.9

# --- fidelities ------------------------------------------------------------------------------------------------------
[mobo.fidelities.search]       # 10k particles (all tracked: the post rule reads the bare run's tracks), SC 64^3 every
                               # 5 steps
overrides = ["track.n_final=10000", "track.sc_final_cells=64", "track.sc_final_every=5", "track.n_tracks=10000"]
timeout_min = 60.0

[mobo.fidelities.verify]       # pcr optimize-verify: every particle, SC 128^3 every step (the posts as the search
                               # placed them)
overrides = ["track.n_final=0", "track.sc_final_cells=128", "track.sc_final_every=1"]
timeout_min = 240.0
