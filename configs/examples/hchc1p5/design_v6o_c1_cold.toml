# The cold start of the full central-region optimization with the v6 field map (2026-11-06, SmootherRMax) and the
# spiral inflector v6o_c1, optimized and levelled for a 38 deg dee opening (2026-11-07): the connected-gap-line cold
# start (design_connected_cold.toml: radial gap lines, gap 0 along the exit plate, gap 0's R 10 mm hole by rule) with
# - the full v6 map (no 2D map: the 3D tracking does not read one), its crop cached on F:;
# - the v6o_c1 hand-off (R 10 mm about the centroid, 97,981 particles, 8.035 mA), the inflector's E-field and housing
#   from its levelled export (the emitting plane and the exit-plane spec found beside the housing outline);
# - the dee opening 38 deg, at which the corner rule turns the inflector by 0 deg (19 - opening / 2), as exported;
# - the plates at |z| 24.5 mm, the v6 map's iron face (channel heights up to 2 x (24.5 - 5) = 39 mm);
# - posts placed by rule in every evaluation of a new geometry ([post_rule]: a bare run, then the posts between the
#   turns' bands on gaps 1-5 and inside the first band on gap 1); round posts (post_shape "cylinder").
# The gap-line items give P2 by its distance from P1 (dr_mm), so an optimizer can move r1 over the turns freely; with
# every fraction 0 (the cold start) r1 and dr do not change the electrodes.
#   pcr evaluate --config configs/examples/hchc1p5/design_v6o_c1_cold.toml --out <folder>
# (posts in the loop: the model with its posts at paths.model3d, the bare one and the post record in that folder's
# bare/). The stage commands (pcr build / fields / track) place no posts: give them other paths.model3d and
# paths.fields (--set), else they take what pcr evaluate left there.

include = ["design_connected_cold.toml"]

[run]
name = "v6o_c1_cold"
out_dir = "F:/HCHC1.5/Results/CR/pcr/v6o_c1_cold/track"
cache_dir = "F:/HCHC1.5/_fieldcache"

[paths]
bfield_3d = "F:/HCHC1.5/Fieldmaps/20261106_HCHC-1.5_3D_FullCyclo_Res1mm_z3cm_xy80cm_IBA_BH_CutPoles_WiderNoses_SmootherRMax_zSym_BCS.txt"
bfield_2d = ""
handoff = "F:/HCHC1.5/Results/CR/handoff_v6o_c1_R10_centroid.h5"           # 97981 particles, 8.035 mA
inflector_efield = "F:/HCHC1.5/Results/triplet/v6o_c1/export_baseline_levelled/efield_fine_best_baseline.pickle"
housing_step = "F:/HCHC1.5/Results/triplet/v6o_c1/export_baseline_levelled/steps_baseline_mm/002_Housing.stp"
housing_outline = "F:/HCHC1.5/Results/triplet/v6o_c1/export_baseline_levelled/steps_baseline_mm/housing_outline.txt"
model3d = "F:/HCHC1.5/Results/CR/pcr/v6o_c1_cold/geometry/cr_model_v6o_c1_cold_model3d.pkl"
fields = "F:/HCHC1.5/Results/CR/pcr/v6o_c1_cold/geometry/bunch_fields3d_v6o_c1_cold.pkl"

[machine]
dee_opening_deg = 38.0

[inflector]
rotation_deg = 0.0                     # the corner rule's turn at 38 deg

[geometry]
plate_half_gap_mm = 24.5
post_shape = "cylinder"

# r1 / dr as in design_connected_cold.toml (r2 = r1 + dr)
[[geometry.gap_line]]
gap = 0
r1_mm = 104.5
dr_mm = 55.0

[[geometry.gap_line]]
gap = 1
r1_mm = 108.5
dr_mm = 47.5

[[geometry.gap_line]]
gap = 2
r1_mm = 110.5
dr_mm = 43.0

[[geometry.gap_line]]
gap = 3
r1_mm = 112.0
dr_mm = 44.0

[[geometry.gap_line]]
gap = 4
r1_mm = 120.5
dr_mm = 47.5

[[geometry.gap_line]]
gap = 5
r1_mm = 130.5
dr_mm = 49.0

[[geometry.gap_line]]
gap = 6
r1_mm = 148.5
dr_mm = 47.5

[[geometry.gap_line]]
gap = 7
r1_mm = 157.0
dr_mm = 45.0

[post_rule]
enabled = true

[score]
beam = "v6o_c1"
