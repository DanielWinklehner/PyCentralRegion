# The demo design: the demo machine's electrodes, fields and a bunch run small enough for a computer without a GPU.
#   python -m PyCentralRegion.demo                                         # the inputs, once (inputs/)
#   pcr evaluate --config configs/examples/demo/design.toml --out output/demo/eval
# builds the electrode model, solves its field, tracks the bunch and scores the run. The model and the field cache go
# to output/demo/ (paths.model3d, paths.fields: a stage reuses what is there). The electrode options are sized for
# the demo's 130 mm dees and +-8 mm beam channel; every other setting is the package default (configs/defaults/).

include = ["machine.toml"]

[run]
name = "demo"
out_dir = "../../../output/demo"

[paths]
model3d = "../../../output/demo/demo_model3d.pkl"
fields = "../../../output/demo/demo_fields.pkl"

[geometry]
half_height_mm = 30.0              # electrodes and housing span z = -30 .. +30 mm
aperture_inner_mm = 14.0           # dee channel full height inside the taper (>= 2 x the housing exit's 5 mm)
aperture_outer_mm = 16.0           # ... and beyond it (<= 2 x (plate_half_gap_mm - dee_wall_mm))
aperture_taper_center_mm = 50.0
aperture_taper_length_mm = 20.0
plate_half_gap_mm = 13.0           # the plates the dees sit between
housing_clearance_mm = 4.0         # dees 1-3 stay this far off the housing
lc_mm = 6.0                        # surface mesh size
r_fine_mm = 80.0
r_coarse_mm = 120.0

[fields]
dxy_m = 0.002                      # the field grid: 2 mm in x and y ...
z_half_m = 0.010                   # ... over |z| <= 10 mm (the channel is +-8 mm)
dz_m = 0.002
stack_z_half_m = 0.016             # the metal test's z range: past the plates
pot_device = "cpu"                 # no GPU needed (the BEM solve takes the GPU by itself when cupy finds one)

[track]
turns = 7
n_scan = 1000                      # particles of each phase-scan run (the seed's phase and +-10 deg)
n_final = 4000                     # ... and of the final run
sc_cells = 32                      # space charge (always on): 32^3 FFT nodes, a solve every 5 steps
sc_final_cells = 32
sc_final_every = 5
sc_gpu = false
n_tracks = 4000

[score]
min_tracks = 2000                  # the run's 4000 stored tracks are enough to score it
